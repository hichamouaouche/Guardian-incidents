# =============================================================
#  Serveur
# =============================================================
server.port=8085
spring.application.name=incidents-backend

# =============================================================
#  Base de donnees H2 (profil par defaut)
#  -> pour MySQL : lancer avec --spring.profiles.active=mysql
# =============================================================
spring.datasource.url=jdbc:h2:mem:incidentsdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =============================================================
#  JWT
#  secret : cle HMAC-SHA256 encodee en Base64 (>= 256 bits)
#  access token  : 5 minutes  (300 000 ms)
#  refresh token : 24 heures  (86 400 000 ms)
# =============================================================
app.jwt.secret=c2RpYS1zZWN1cml0ZS1hcHBsaWNhdGlvbnMtand0LXNlY3JldC1rZXktMjAyNi1pbmNpZGVudHMtYXBw
app.jwt.access-expiration-ms=300000
app.jwt.refresh-expiration-ms=86400000

# =============================================================
#  CORS : application React (Vite)
# =============================================================
app.cors.allowed-origins=http://localhost:5173

# Messages d'erreur : ne pas exposer les stacktraces
server.error.include-stacktrace=never
server.error.include-message=never
